name: MeetingNotes
options:
  bundleIdPrefix: com.soonup
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: 6A2SZH3VT5
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MeetingNotes:
    type: application
    platform: macOS
    sources:
      - path: MeetingNotes
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
    info:
      path: MeetingNotes/Info.plist
      properties:
        CFBundleName: Meeting Notes
        CFBundleDisplayName: Meeting Notes
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "3"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Meeting Notes listens to your microphone to transcribe what you say in meetings.
        NSAudioCaptureUsageDescription: Meeting Notes captures call audio from apps like Zoom, Teams or Meet to transcribe the other participants.
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soonup.meetingnotes
        PRODUCT_NAME: Meeting Notes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MeetingNotes/MeetingNotes.entitlements
        GENERATE_INFOPLIST_FILE: NO
  MeetingNotesTests:
    type: bundle.unit-test
    platform: macOS
    # No host app: the pure sources are compiled into the bundle, so tests never launch the app.
    sources:
      - path: MeetingNotesTests
      - path: MeetingNotes/Models
      - path: MeetingNotes/Claude
      - path: MeetingNotes/Transcription
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soonup.meetingnotes.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  MeetingNotes:
    build:
      targets:
        MeetingNotes: all
        MeetingNotesTests: [test]
    test:
      targets:
        - MeetingNotesTests
